<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src https://cdn.discordapp.com; style-src 'self'"
    />
    <link rel="stylesheet" href="overlay.css" />
    <title>CouchCord</title>
  </head>
  <body>
    <aside id="hud" class="hidden">
      <div class="hud-header">
        <span class="hud-bug">🔊</span>
        <span id="hud-channel" class="hud-channel"></span>
        <span id="hud-flags" class="hud-flags"></span>
      </div>
      <ul id="hud-members"></ul>
    </aside>

    <section id="panel" class="hidden">
      <header class="panel-header">
        <svg class="brand-mark" viewBox="58 88 420 340" aria-hidden="true">
          <g fill="#ff6b4a">
            <rect x="116" y="212" width="240" height="140" rx="42" />
            <rect x="76" y="268" width="66" height="126" rx="33" />
            <rect x="330" y="268" width="66" height="126" rx="33" />
            <rect x="100" y="322" width="272" height="72" rx="34" />
            <rect x="128" y="394" width="44" height="26" rx="12" />
            <rect x="300" y="394" width="44" height="26" rx="12" />
          </g>
          <g stroke="#2fd98c" stroke-width="30" stroke-linecap="round" fill="none">
            <path d="M 356 152 A 60 60 0 0 1 416 212" />
            <path d="M 356 106 A 106 106 0 0 1 462 212" />
          </g>
        </svg>
        <span class="panel-title">Couch<span class="brand-b">Cord</span></span>
        <span id="panel-status" class="panel-status"></span>
      </header>
      <div id="panel-members" class="panel-members"></div>
      <div id="view-main" class="btn-grid"></div>
      <div id="view-list" class="list-view hidden">
        <p id="list-title" class="list-title"></p>
        <ul id="list-rows" class="list-rows"></ul>
        <p id="list-hint" class="list-hint hidden"></p>
      </div>
      <footer id="panel-hints" class="panel-hints"></footer>
    </section>

    <script src="overlay.js"></script>
  </body>
</html>
