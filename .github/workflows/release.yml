name: Build installer

on:
  release:
    types: [published] # hand-made releases still build + attach
  push:
    tags: ["v*"] # pushing a version tag creates the release itself
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the v<package.json version> release (tag + notes + installer)"
        type: boolean
        default: false
    # without 'publish': a test run that only produces the installer artifact

permissions:
  contents: write # create the release / attach the installer

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            tag="${{ github.ref_name }}"
          elif [ "${{ inputs.publish }}" = "true" ]; then
            tag="v$(node -p "require('./package.json').version")"
          else
            tag=""
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # The installer's version comes from package.json — catch a mismatched
      # tag before shipping an exe that claims a different version.
      - name: Check tag matches package.json version
        if: steps.tag.outputs.tag != ''
        shell: bash
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          tag="${{ steps.tag.outputs.tag }}"
          if [ "$pkg" != "$tag" ]; then
            echo "Tag $tag does not match package.json version $pkg." >&2
            echo "Bump the version in package.json (npm version --no-git-tag-version) and retag." >&2
            exit 1
          fi

      - run: npm ci

      - run: npm run dist

      # Tag-push and dispatch-publish paths: create the release if it doesn't
      # exist yet ('--target' also creates the tag when needed). Tags and
      # releases created with GITHUB_TOKEN don't re-trigger this workflow, so
      # the other triggers can't cause a second run.
      - name: Create release if missing
        if: steps.tag.outputs.tag != '' && github.event_name != 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists"
          elif [ -f "release-notes/$tag.md" ]; then
            gh release create "$tag" --target "${{ github.sha }}" --title "CouchCord $tag" --notes-file "release-notes/$tag.md"
          else
            gh release create "$tag" --target "${{ github.sha }}" --title "CouchCord $tag" --generate-notes
          fi

      - name: Attach installer to the release
        if: steps.tag.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ steps.tag.outputs.tag }}" dist/CouchCord-Setup-*.exe --clobber

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CouchCord-Setup
          path: dist/CouchCord-Setup-*.exe
