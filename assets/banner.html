<!DOCTYPE html>
<html>
  <!-- Source for assets/banner.png — regenerate with `npm run assets`. -->
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Nunito";
        src: url("fonts/Nunito-Black.ttf");
        font-weight: 900;
      }
      @font-face {
        font-family: "Nunito";
        src: url("fonts/Nunito-ExtraBold.ttf");
        font-weight: 800;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 300px;
        background: radial-gradient(120% 160% at 30% 20%, #1a2040 0%, #0e1220 62%);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 56px;
        font-family: "Nunito", sans-serif;
        overflow: hidden;
      }
      img {
        width: 220px;
        height: auto;
      }
      .wordmark {
        font-weight: 900;
        font-size: 88px;
        letter-spacing: -2px;
        line-height: 1.05;
      }
      .wordmark .a {
        color: #f5efe6;
      }
      .wordmark .b {
        color: #ff6b4a;
      }
      .tagline {
        font-weight: 800;
        font-size: 26px;
        color: #8f96ab;
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <img src="logo.svg" alt="" />
    <div>
      <div class="wordmark"><span class="a">Couch</span><span class="b">Cord</span></div>
      <div class="tagline">Discord voice, from the couch.</div>
    </div>
  </body>
</html>
